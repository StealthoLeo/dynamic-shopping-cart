<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dynamic Shopping Cart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="container py-4">
    <div class="row mb-3">
      <div class="col">
        <h1>Dynamic Shopping Cart</h1>
    </div>

    <div id="product-container" class="row g-2 align-items-center mb-4">
      <div class="col-sm-5">
        <label for="product-name" class="form-label visually-hidden">Product Name</label>
        <input type="text" id="product-name" class="form-control" placeholder="Product Name" aria-label="Product name">
      </div>

      <div class="col-sm-3">
        <label for="product-price" class="form-label visually-hidden">Product Price</label>
        <input type="number" id="product-price" class="form-control" placeholder="Product Price" step="0.01" min="0" aria-label="Product price">
      </div>

      <div class="col-sm-2 d-grid">
        <button id="add-product" class="btn btn-primary">Add Product</button>
      </div>

      <div class="col-sm-2 text-end">
        <small class="text-muted">Total: $<span id="total-price">0.00</span></small>
      </div>
    </div>
    <div class="row">
      <div class="col-12">
        <ul id="cart" class="list-group" aria-live="polite"></ul>
      </div>
    </div>
    <div class="row mt-3">
      <div class="col-12">
        <h3 class="h5">Summary</h3>
        <p class="mb-0">Total: <strong>$<span id="total-price-duplicate" class="visually-hidden">0.00</span></strong></p>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./script.js"></script>
</body>
</html>
